<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo — MAG</title>
<link rel="stylesheet" href="mag-common.css" />
</head>
<body>
<div id="mag-chrome"></div>

<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow">Todas las piezas</span>
    <h2 id="cat-page-title">Catálogo</h2>
    <p class="lead" id="cat-page-lead">Explora todas las piezas hechas a mano.</p>
  </div>
</section>

<section class="catalog-layout">
  <div class="wrap catalog-layout-inner">
    <aside class="cat-sidebar">
      <h4>Categorías</h4>
      <nav id="cat-sidebar-list"></nav>
    </aside>
    <div class="catalog-main">
      <div id="search-filter-pill"></div>
      <div class="grid" id="grid"></div>
      <p class="empty-msg" id="empty-msg" style="display:none;">Todavía no hay piezas en esta categoría.</p>
    </div>
  </div>
</section>

<footer>
  <div class="wrap inner">
    <div>
      <h4>MAG</h4>
      <p style="opacity:0.85; font-size:14px; max-width:260px;">Piezas hechas a mano, a tu ritmo y con la tela que más te guste.</p>
    </div>
    <div>
      <h4>Piezas</h4>
      <div id="footer-cats-2"></div>
    </div>
    <div>
      <h4>Contacto</h4>
      <div id="cat-footer-contact"></div>
    </div>
  </div>
  <div class="wrap foot-bottom">hecho a mano · hecho con cariño</div>
</footer>

<script src="mag-common.js"></script>
<script>
async function initCatalogPage() {
  const products = await loadAllProducts();
  const categories = [...new Set(products.map((p) => p.categoria).filter(Boolean))];
  const params = new URLSearchParams(window.location.search);
  const activeCat = params.get("cat") || "";
  const searchTerm = params.get("buscar") || "";

  const sidebarList = document.getElementById("cat-sidebar-list");
  sidebarList.innerHTML = `<a href="catalogo.html" class="${!activeCat ? "active" : ""}">Todos los productos</a>` +
    categories.map((c) => `<a href="catalogo.html?cat=${encodeURIComponent(c)}" class="${activeCat === c ? "active" : ""}">${c}</a>`).join("");

  document.getElementById("cat-page-title").textContent = activeCat || "Catálogo";
  document.getElementById("cat-page-lead").textContent = activeCat
    ? `Todas las piezas de la categoría ${activeCat}.`
    : "Explora todas las piezas hechas a mano.";

  const pillHolder = document.getElementById("search-filter-pill");
  if (searchTerm) {
    pillHolder.innerHTML = `<div class="filter-pill">Buscando: <strong>${searchTerm}</strong> <button id="clear-filter">✕ quitar</button></div>`;
    document.getElementById("clear-filter").addEventListener("click", () => {
      window.location.href = activeCat ? `catalogo.html?cat=${encodeURIComponent(activeCat)}` : "catalogo.html";
    });
  }

  let visible = activeCat ? products.filter((p) => p.categoria === activeCat) : products;
  if (searchTerm) visible = visible.filter((p) => (p.nombre || "").toLowerCase().includes(searchTerm.toLowerCase()));

  const grid = document.getElementById("grid");
  const emptyMsg = document.getElementById("empty-msg");
  emptyMsg.style.display = visible.length === 0 ? "block" : "none";
  grid.innerHTML = visible.map((p, i) => productCardHTML(p, i)).join("");
  bindProductCardEvents(grid, visible);

  document.getElementById("footer-cats-2").innerHTML = categories.slice(0, 4)
    .map((c) => `<div style="margin-bottom:6px;"><a href="catalogo.html?cat=${encodeURIComponent(c)}">${c}</a></div>`).join("");
}

document.addEventListener("DOMContentLoaded", () => {
  initCatalogPage();
  document.getElementById("cat-footer-contact").innerHTML = `
    <div style="margin-bottom:6px;"><a href="https://wa.me/${window.MAG_CONFIG.WHATSAPP_NUMBER}" target="_blank" rel="noreferrer">WhatsApp</a></div>
    <div style="margin-bottom:6px;"><a href="https://instagram.com/${window.MAG_CONFIG.INSTAGRAM_USER}" target="_blank" rel="noreferrer">@${window.MAG_CONFIG.INSTAGRAM_USER}</a></div>
    <div style="margin-bottom:6px;"><a href="mailto:${window.MAG_CONFIG.EMAIL}">${window.MAG_CONFIG.EMAIL}</a></div>
  `;
});
</script>
</body>
</html>
