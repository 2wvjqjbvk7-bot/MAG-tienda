/* ====================================================================
   CESTA — igual que en index.html, se comparte vía localStorage
   ==================================================================== */
let cart = [];
function loadCart() {
  try { const s = localStorage.getItem("mag_cart"); cart = s ? JSON.parse(s) : []; } catch (e) { cart = []; }
}
function saveCart() { try { localStorage.setItem("mag_cart", JSON.stringify(cart)); } catch (e) {} }
function removeFromCart(nombre) { cart = cart.filter((i) => i.nombre !== nombre); saveCart(); renderCart(); }
function changeQty(nombre, delta) {
  const item = cart.find((i) => i.nombre === nombre);
  if (!item) return;
  item.cantidad += delta;
  if (item.cantidad <= 0) { removeFromCart(nombre); return; }
  saveCart(); renderCart();
}
function renderCart() {
  const itemsEl = document.getElementById("cart-items");
  const countEl = document.getElementById("cart-count");
  const countMini = document.getElementById("cart-count-mini");
  const totalEl = document.getElementById("cart-total");
  const checkoutBtn = document.getElementById("cart-checkout");
  const totalQty = cart.reduce((sum, i) => sum + i.cantidad, 0);
  countEl.textContent = totalQty;
  countMini.textContent = totalQty;
  if (cart.length === 0) {
    itemsEl.innerHTML = `<p class="cart-empty">Tu cesta está vacía todavía.</p>`;
  } else {
    itemsEl.innerHTML = cart.map((item) => `
      <div class="cart-item">
        <div class="cart-item-thumb" style="${item.imagen ? `background-image:url('${item.imagen}')` : ""}"></div>
        <div class="cart-item-body">
          <span class="cart-item-name">${item.nombre}</span>
          <span class="cart-item-price">${item.precio} € × ${item.cantidad}</span>
          <div class="qty-row">
            <button class="qty-btn" data-action="minus" data-name="${item.nombre}">−</button>
            <span class="mono">${item.cantidad}</span>
            <button class="qty-btn" data-action="plus" data-name="${item.nombre}">+</button>
            <button class="cart-remove" data-action="remove" data-name="${item.nombre}">quitar</button>
          </div>
        </div>
      </div>`).join("");
    itemsEl.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const name = btn.dataset.name;
        if (btn.dataset.action === "plus") changeQty(name, 1);
        else if (btn.dataset.action === "minus") changeQty(name, -1);
        else if (btn.dataset.action === "remove") removeFromCart(name);
      });
    });
  }
  const total = cart.reduce((sum, i) => sum + (parseFloat(i.precio) || 0) * i.cantidad, 0);
  totalEl.textContent = total.toFixed(2) + " €";
  if (cart.length === 0) {
    checkoutBtn.classList.add("cart-checkout-disabled");
    checkoutBtn.href = "#";
  } else {
    checkoutBtn.classList.remove("cart-checkout-disabled");
    const lines = cart.map((i) => `- ${i.nombre} ×${i.cantidad} (${i.precio}€)`).join("\n");
    checkoutBtn.href = waLink(`Hola! Quiero hacer este pedido:\n${lines}\n\nTotal: ${total.toFixed(2)}€`);
  }
}
function openCart() { document.getElementById("cart-panel").classList.add("open"); document.getElementById("cart-overlay").classList.add("open"); }
function closeCart() { document.getElementById("cart-panel").classList.remove("open"); document.getElementById("cart-overlay").classList.remove("open"); }
document.getElementById("cart-fab").addEventListener("click", openCart);
document.getElementById("cart-close").addEventListener("click", closeCart);
document.getElementById("cart-overlay").addEventListener("click", closeCart);
document.getElementById("cart-icon-btn").addEventListener("click", openCart);
loadCart();
renderCart();

/* ====================================================================
   MENÚ LATERAL Y BUSCADOR (el buscador lleva al catálogo del inicio)
   ==================================================================== */
const menuBtn = document.getElementById("menu-btn");
const navDrawer = document.getElementById("nav-drawer");
const navOverlay = document.getElementById("nav-overlay");
document.getElementById("nav-drawer-close").addEventListener("click", () => { navDrawer.classList.remove("open"); navOverlay.classList.remove("open"); });
menuBtn.addEventListener("click", () => { navDrawer.classList.add("open"); navOverlay.classList.add("open"); });
navOverlay.addEventListener("click", () => { navDrawer.classList.remove("open"); navOverlay.classList.remove("open"); });
document.getElementById("search-btn").addEventListener("click", () => { window.location.href = "index.html#catalogo"; });

/* ====================================================================
   HEADER: se mantiene al bajar, desaparece al subir
   ==================================================================== */
function syncHeaderHeight() { document.body.style.paddingTop = document.getElementById("site-header").offsetHeight + "px"; }
syncHeaderHeight();
window.addEventListener("resize", syncHeaderHeight);
let lastScrollY = window.scrollY;
const siteHeader = document.getElementById("site-header");
window.addEventListener("scroll", () => {
  const current = window.scrollY;
  if (current > lastScrollY && current > 40) siteHeader.classList.remove("header-hidden");
  else if (current < lastScrollY) siteHeader.classList.add("header-hidden");
  lastScrollY = current;
}, { passive: true });

/* ====================================================================
   PESTAÑAS LEGALES
   ==================================================================== */
const tabsEl = document.getElementById("legal-tabs");
const contentEl = document.getElementById("legal-content");
const order = ["devoluciones", "envios", "aviso", "contacto"];

function renderTabs(active) {
  tabsEl.innerHTML = order.map((key) => `<button class="legal-tab ${key === active ? "active" : ""}" data-key="${key}">${LEGAL_LABELS[key]}</button>`).join("");
  tabsEl.querySelectorAll(".legal-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      history.replaceState(null, "", "#" + btn.dataset.key);
      showTab(btn.dataset.key);
    });
  });
}
function showTab(key) {
  contentEl.innerHTML = LEGAL_TEXTS[key] || LEGAL_TEXTS.devoluciones;
  renderTabs(key);
}
const initial = order.includes(location.hash.replace("#", "")) ? location.hash.replace("#", "") : "devoluciones";
showTab(initial);
</script>
