/* ====================================================================
   4) Cargar catálogo desde Google Sheets (o demo si no está configurado)
   ==================================================================== */
function waLink(text) {
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
}

/* ====================================================================
   CESTA — se guarda en el navegador del cliente (localStorage) para
   que no se pierda si recarga la página, hasta que haga el pedido.
   ==================================================================== */
let cart = [];

function loadCart() {
  try {
    const saved = localStorage.getItem("mag_cart");
    cart = saved ? JSON.parse(saved) : [];
  } catch (e) {
    cart = [];
  }
}

function saveCart() {
  try { localStorage.setItem("mag_cart", JSON.stringify(cart)); } catch (e) {}
}

function addToCart(p) {
  const existing = cart.find((item) => item.nombre === p.nombre);
  if (existing) {
    existing.cantidad += 1;
  } else {
    cart.push({ nombre: p.nombre, precio: p.precio, imagen: p.imagen || "", cantidad: 1 });
  }
  saveCart();
  renderCart();
  openCart();
}

function removeFromCart(nombre) {
  cart = cart.filter((item) => item.nombre !== nombre);
  saveCart();
  renderCart();
}

function changeQty(nombre, delta) {
  const item = cart.find((i) => i.nombre === nombre);
  if (!item) return;
  item.cantidad += delta;
  if (item.cantidad <= 0) { removeFromCart(nombre); return; }
  saveCart();
  renderCart();
}

function renderCart() {
  const itemsEl = document.getElementById("cart-items");
  const countEl = document.getElementById("cart-count");
  const totalEl = document.getElementById("cart-total");
  const checkoutBtn = document.getElementById("cart-checkout");

  countEl.textContent = cart.reduce((sum, i) => sum + i.cantidad, 0);

  if (cart.length === 0) {
    itemsEl.innerHTML = `<p class="cart-empty">Tu cesta está vacía todavía.<br>Añade alguna pieza del catálogo.</p>`;
  } else {
    itemsEl.innerHTML = cart.map((item) => {
      const bg = item.imagen ? `background-image:url('${item.imagen}')` : `background:${SWATCHES[0]}`;
      return `
        <div class="cart-item">
          <div class="cart-item-thumb" style="${bg}"></div>
          <div class="cart-item-body">
            <span class="cart-item-name">${item.nombre}</span>
            <span class="cart-item-price">${item.precio} € × ${item.cantidad}</span>
            <div class="qty-row">
              <button class="qty-btn" data-action="minus" data-name="${item.nombre}">−</button>
              <span class="mono">${item.cantidad}</span>
              <button class="qty-btn" data-action="plus" data-name="${item.nombre}">+</button>
              <button class="cart-remove" data-action="remove" data-name="${item.nombre}">quitar</button>
            </div>
          </div>
        </div>`;
    }).join("");
    itemsEl.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const name = btn.dataset.name;
        if (btn.dataset.action === "plus") changeQty(name, 1);
        else if (btn.dataset.action === "minus") changeQty(name, -1);
        else if (btn.dataset.action === "remove") removeFromCart(name);
      });
    });
  }

  const total = cart.reduce((sum, i) => sum + (parseFloat(i.precio) || 0) * i.cantidad, 0);
  totalEl.textContent = total.toFixed(2) + " €";

  if (cart.length === 0) {
    checkoutBtn.classList.add("cart-checkout-disabled");
    checkoutBtn.href = "#";
  } else {
    checkoutBtn.classList.remove("cart-checkout-disabled");
    const lines = cart.map((i) => `- ${i.nombre} ×${i.cantidad} (${i.precio}€)`).join("\n");
    const msg = `Hola! Quiero hacer este pedido:\n${lines}\n\nTotal: ${total.toFixed(2)}€`;
    checkoutBtn.href = waLink(msg);
  }
}

function openCart() {
  document.getElementById("cart-panel").classList.add("open");
  document.getElementById("cart-overlay").classList.add("open");
}
function closeCart() {
  document.getElementById("cart-panel").classList.remove("open");
  document.getElementById("cart-overlay").classList.remove("open");
}

document.getElementById("cart-fab").addEventListener("click", openCart);
document.getElementById("cart-close").addEventListener("click", closeCart);
document.getElementById("cart-overlay").addEventListener("click", closeCart);

loadCart();
renderCart();

function render(products) {
  const categories = [...new Set(products.map((p) => p.categoria).filter(Boolean))];
  const catBar = document.getElementById("cat-bar");
  const footerCats = document.getElementById("footer-cats");
  let activeCategory = "Todas";

  function renderChips() {
    catBar.innerHTML = `<button class="chip ${activeCategory === "Todas" ? "active" : ""}" data-cat="Todas">Todas</button>` +
      categories.map((c) => `<button class="chip ${activeCategory === c ? "active" : ""}" data-cat="${c}">${c}</button>`).join("");
    catBar.querySelectorAll(".chip").forEach((btn) => btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat;
      renderChips();
      renderGrid();
    }));
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    const emptyMsg = document.getElementById("empty-msg");
    const visible = activeCategory === "Todas" ? products : products.filter((p) => p.categoria === activeCategory);
    emptyMsg.style.display = visible.length === 0 ? "block" : "none";
    grid.innerHTML = visible.map((p, i) => {
      const available = (p.disponible || "SI").toUpperCase() !== "NO";
      const bg = p.imagen ? `background-image:url('${p.imagen}')` : `background:${SWATCHES[i % SWATCHES.length]}`;
      return `
        <div class="card">
          <svg class="hang-tag" viewBox="0 0 36 36"><path d="M4 4 L20 4 L32 16 L20 32 L4 32 Z" fill="#F7F3EA" stroke="#2B2420" stroke-width="1.5"/><circle cx="11" cy="12" r="2.2" fill="none" stroke="#2B2420" stroke-width="1.5"/></svg>
          <div class="thumb" style="${bg}">${p.imagen ? "" : `<span class="swatch-label mono">foto pendiente</span>`}</div>
          <div class="body">
            <span class="cat-label">${p.categoria || ""}</span>
            <h3>${p.nombre || ""}</h3>
            <p class="desc">${p.descripcion || ""}</p>
            <div class="price-row">
              <span class="price">${p.precio || "0"} €</span>
              ${available ? `<button class="btn btn-ghost btn-sm add-cart-btn" data-idx="${i}">Añadir a la cesta</button>` : `<span class="unavailable-badge">no disponible</span>`}
            </div>
          </div>
        </div>`;
    }).join("");
    grid.querySelectorAll(".add-cart-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        addToCart(visible[parseInt(btn.dataset.idx, 10)]);
      });
    });
  }

  footerCats.innerHTML = categories.slice(0, 4).map((c) => `<div style="margin-bottom:6px;"><a href="#catalogo">${c}</a></div>`).join("");

  renderChips();
  renderGrid();
}

async function init() {
  try {
    const res = await fetch("./products.json");
    const products = await res.json();
    render(Array.isArray(products) && products.length ? products : DEMO_PRODUCTS);
  } catch (e) {
    console.error("No se pudo cargar products.json:", e);
    render(DEMO_PRODUCTS);
  }
}

const hablamosForm = document.getElementById("hablamos-form");
if (hablamosForm) {
  hablamosForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const nombre = document.getElementById("f-nombre").value.trim();
    const email = document.getElementById("f-email").value.trim();
    const asunto = document.getElementById("f-asunto").value.trim();
    const telefono = document.getElementById("f-telefono").value.trim();
    const mensaje = document.getElementById("f-mensaje").value.trim();

    if (!nombre || !email) {
      alert("Por favor, rellena al menos tu nombre y tu email.");
      return;
    }

    let text = `Hola! Soy ${nombre}.\n`;
    if (asunto) text += `Asunto: ${asunto}\n`;
    text += `Email: ${email}\n`;
    if (telefono) text += `Teléfono: ${telefono}\n`;
    if (mensaje) text += `\n${mensaje}`;

    window.open(waLink(text), "_blank", "noreferrer");
    hablamosForm.reset();
  });
}

init();
</script>
