  .hablamos .inner { display: grid; grid-template-columns: 1fr 1.15fr; gap: 60px; align-items: start; }
  @media (max-width: 800px) { .hablamos .inner { grid-template-columns: 1fr; } }
  .hablamos h2 { font-size: clamp(28px, 3.6vw, 38px); margin-bottom: 16px; }
  .hablamos .lead { color: var(--color-ink-soft); font-size: 15px; margin-bottom: 24px; max-width: 420px; }
  .custom-options { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .custom-option { position: relative; }
  .custom-option input { position: absolute; opacity: 0; }
  .custom-option label { display: block; font-family: 'Space Mono', monospace; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 18px; border: 1.5px dashed var(--color-line); border-radius: 20px; color: var(--color-ink-soft); cursor: pointer; }
  .custom-option input:checked + label { background: var(--color-ink); border-color: var(--color-ink); border-style: solid; color: var(--color-bg); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 520px) { .form-row { grid-template-columns: 1fr; } }

  .form-group input, .form-group textarea { font-family: 'Work Sans', sans-serif; font-size: 14px; padding: 12px 14px; border: 1px solid var(--color-line); border-radius: 3px; background: var(--color-bg); color: var(--color-ink); width: 100%; }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--color-ink); }
  .form-group textarea { resize: vertical; min-height: 110px; }
`;
const styleTag = document.createElement("style");
styleTag.textContent = css;
document.head.appendChild(styleTag);

document.getElementById("root").innerHTML = `

        <h1><a href="index.html" style="color:inherit; text-decoration:none;">MAG</a></h1>

        </button>
        <button class="icon-btn" id="cart-icon-btn" aria-label="Cesta">
          🧺<span class="cart-badge" id="cart-count-mini">0</span>
        </button>
      </div>
    </div>
    <svg class="stitch" viewBox="0 0 400 8" preserveAspectRatio="none"><line x1="0" y1="4" x2="400" y2="4" stroke="#C9BCA8" stroke-width="2" stroke-dasharray="10 8" stroke-linecap="round"/></svg>
  </header>

  <div class="nav-overlay" id="nav-overlay"></div>
  <nav class="nav-drawer" id="nav-drawer">
    <button class="nav-drawer-close" id="nav-drawer-close">×</button>
    <a href="index.html#top">Inicio</a>
    <a href="index.html#catalogo">Catálogo</a>
    <a href="personalizacion.html">Personalización 100%</a>
    <a href="index.html#sobre">Sobre MAG</a>
    <a href="index.html#contacto">¿Hablamos?</a>
    <a href="index.html#pie">Contacto</a>
  </nav>

  <section class="custom-intro">
    <div class="wrap">
      <h2>Personalización 100%</h2>

      <p>Para realizar una personalización, solo tienes que ponerte en contacto con nosotros y contarnos con el mayor detalle posible qué tienes en mente. Estudiaremos tu propuesta y te informaremos de si es posible llevarla a cabo, buscando siempre la mejor opción para conseguir un resultado que se adapte a lo que imaginas.</p>

  <section class="hablamos" id="contacto">

      </div>
      <form class="hablamos-form" id="custom-form">

function waLink(text) { return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`; }

/* CESTA (compartida vía localStorage con el resto de la web) */
let cart = [];
function loadCart() { try { const s = localStorage.getItem("mag_cart"); cart = s ? JSON.parse(s) : []; } catch (e) { cart = []; } }
function saveCart() { try { localStorage.setItem("mag_cart", JSON.stringify(cart)); } catch (e) {} }
function removeFromCart(nombre) { cart = cart.filter((i) => i.nombre !== nombre); saveCart(); renderCart(); }
function changeQty(nombre, delta) {
  const item = cart.find((i) => i.nombre === nombre);
  if (!item) return;
  item.cantidad += delta;
  if (item.cantidad <= 0) { removeFromCart(nombre); return; }
  saveCart(); renderCart();
}
function renderCart() {
  const itemsEl = document.getElementById("cart-items");
  const countEl = document.getElementById("cart-count");
  const countMini = document.getElementById("cart-count-mini");
  const totalEl = document.getElementById("cart-total");
  const checkoutBtn = document.getElementById("cart-checkout");
  const totalQty = cart.reduce((sum, i) => sum + i.cantidad, 0);
  countEl.textContent = totalQty;
  countMini.textContent = totalQty;
  if (cart.length === 0) {
    itemsEl.innerHTML = `<p class="cart-empty">Tu cesta está vacía todavía.</p>`;
  } else {
    itemsEl.innerHTML = cart.map((item) => `
      <div class="cart-item">
        <div class="cart-item-thumb" style="${item.imagen ? `background-image:url('${item.imagen}')` : ""}"></div>
        <div class="cart-item-body">
          <span class="cart-item-name">${item.nombre}</span>
          <span class="cart-item-price">${item.precio} € × ${item.cantidad}</span>
          <div class="qty-row">
            <button class="qty-btn" data-action="minus" data-name="${item.nombre}">−</button>
            <span class="mono">${item.cantidad}</span>
            <button class="qty-btn" data-action="plus" data-name="${item.nombre}">+</button>
            <button class="cart-remove" data-action="remove" data-name="${item.nombre}">quitar</button>
          </div>
        </div>
      </div>`).join("");
    itemsEl.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const name = btn.dataset.name;
        if (btn.dataset.action === "plus") changeQty(name, 1);
        else if (btn.dataset.action === "minus") changeQty(name, -1);
        else if (btn.dataset.action === "remove") removeFromCart(name);
      });
    });
  }
  const total = cart.reduce((sum, i) => sum + (parseFloat(i.precio) || 0) * i.cantidad, 0);
  totalEl.textContent = total.toFixed(2) + " €";
  if (cart.length === 0) {
    checkoutBtn.classList.add("cart-checkout-disabled");
    checkoutBtn.href = "#";
  } else {
    checkoutBtn.classList.remove("cart-checkout-disabled");
    const lines = cart.map((i) => `- ${i.nombre} ×${i.cantidad} (${i.precio}€)`).join("\n");
    checkoutBtn.href = waLink(`Hola! Quiero hacer este pedido:\n${lines}\n\nTotal: ${total.toFixed(2)}€`);
  }
}
function openCart() { document.getElementById("cart-panel").classList.add("open"); document.getElementById("cart-overlay").classList.add("open"); }
function closeCart() { document.getElementById("cart-panel").classList.remove("open"); document.getElementById("cart-overlay").classList.remove("open"); }
document.getElementById("cart-fab").addEventListener("click", openCart);
document.getElementById("cart-close").addEventListener("click", closeCart);
document.getElementById("cart-overlay").addEventListener("click", closeCart);
document.getElementById("cart-icon-btn").addEventListener("click", openCart);
loadCart();
renderCart();

/* MENÚ Y BUSCADOR */
const navDrawer = document.getElementById("nav-drawer");
const navOverlay = document.getElementById("nav-overlay");
document.getElementById("menu-btn").addEventListener("click", () => { navDrawer.classList.add("open"); navOverlay.classList.add("open"); });
document.getElementById("nav-drawer-close").addEventListener("click", () => { navDrawer.classList.remove("open"); navOverlay.classList.remove("open"); });
navOverlay.addEventListener("click", () => { navDrawer.classList.remove("open"); navOverlay.classList.remove("open"); });
document.getElementById("search-btn").addEventListener("click", () => { window.location.href = "index.html#catalogo"; });

/* HEADER: se mantiene al bajar, desaparece al subir */
function syncHeaderHeight() { document.body.style.paddingTop = document.getElementById("site-header").offsetHeight + "px"; }
syncHeaderHeight();
window.addEventListener("resize", syncHeaderHeight);
let lastScrollY = window.scrollY;
const siteHeader = document.getElementById("site-header");
window.addEventListener("scroll", () => {
  const current = window.scrollY;
  if (current > lastScrollY && current > 40) siteHeader.classList.remove("header-hidden");
  else if (current < lastScrollY) siteHeader.classList.add("header-hidden");
  lastScrollY = current;
}, { passive: true });

/* FORMULARIO -> WHATSAPP con las opciones de personalización elegidas */
document.getElementById("custom-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const nombre = document.getElementById("f-nombre").value.trim();
  const email = document.getElementById("f-email").value.trim();
  const asunto = document.getElementById("f-asunto").value.trim();
  const telefono = document.getElementById("f-telefono").value.trim();
  const mensaje = document.getElementById("f-mensaje").value.trim();
  const opciones = ["opt-letras", "opt-palabras", "opt-frase"]
    .map((id) => document.getElementById(id))
    .filter((el) => el.checked)
    .map((el) => el.value);

  if (!nombre || !email) { alert("Por favor, rellena al menos tu nombre y tu email."); return; }

  let text = `Hola! Soy ${nombre} y quiero un pedido personalizado.\n`;
  if (opciones.length) text += `Tipo de personalización: ${opciones.join(", ")}\n`;
  if (asunto) text += `Asunto: ${asunto}\n`;
  text += `Email: ${email}\n`;
  if (telefono) text += `Teléfono: ${telefono}\n`;
  if (mensaje) text += `\n${mensaje}`;

  window.open(waLink(text), "_blank", "noreferrer");
  document.getElementById("custom-form").reset();
});
</script>
